name: macrocenter

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-macrocenter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-macrocenter}
      POSTGRES_DB: ${POSTGRES_DB:-macrocenter}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-macrocenter} -d ${POSTGRES_DB:-macrocenter}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Macrocenter.Api/Dockerfile
      target: final
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: >-
        Host=db;Port=5432;Database=${POSTGRES_DB:-macrocenter};Username=${POSTGRES_USER:-macrocenter};Password=${POSTGRES_PASSWORD:-macrocenter}
      Jwt__Key: ${JWT_KEY:-local-development-signing-key-change-me-at-least-32-chars}
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      # /health returns 503 when Postgres is unreachable, so this reflects the
      # whole stack rather than just the web server being up.
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      target: final
    environment:
      # Read by the browser, so it must be the host-visible API address.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      # Read by server components inside the container network.
      API_URL: ${API_URL:-http://api:8080}
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  pgdata:
